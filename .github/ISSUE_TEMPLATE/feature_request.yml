name: Feature request
description: Suggest an improvement to Price Tag Generator
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Explain the workflow or user need, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the desired behavior and any useful examples.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share workarounds or other approaches you considered.
