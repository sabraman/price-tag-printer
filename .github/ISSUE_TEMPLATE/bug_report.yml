name: Bug report
description: Report a reproducible problem in the editor, API, or documentation
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials and private product data before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest set of steps, inputs, or API requests.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, deployment URL, or API client.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add sanitized logs or screenshots if they help explain the issue.
